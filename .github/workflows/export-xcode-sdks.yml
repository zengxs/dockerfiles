name: Export iOS 26.1 SDKs

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  export:
    runs-on: macos-26
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer

    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: "1.3.0"

      - name: Validate and package SDKs
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          xcode_version = output("xcodebuild", "-version")
          expected = "Xcode 26.1.1\nBuild version 17B100"
          if xcode_version != expected:
              raise SystemExit(f"Unexpected Xcode version:\n{xcode_version}")

          destination = Path(os.environ["RUNNER_TEMP"]) / "apple-ios-sdks"
          destination.mkdir()

          metadata = {
              "xcode_version": "26.1.1",
              "xcode_build": "17B100",
              "runner_image_version": os.environ.get("ImageVersion"),
              "workflow_run": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "sdks": [],
          }

          for sdk, directory in [
              ("iphoneos", "iPhoneOS26.1.sdk"),
              ("iphonesimulator", "iPhoneSimulator26.1.sdk"),
          ]:
              version = output("xcrun", "--sdk", sdk, "--show-sdk-version")
              if version != "26.1":
                  raise SystemExit(f"Unexpected {sdk} version: {version}")

              source = Path(
                  output("xcrun", "--sdk", sdk, "--show-sdk-path")
              ).resolve(strict=True)

              if not (source / "SDKSettings.json").is_file():
                  raise SystemExit(f"SDKSettings.json is missing: {source}")

              archive = destination / f"{directory}.tar.gz"
              print(f"Packaging {source} -> {archive}", flush=True)

              # Dereference symlinks to avoid dependencies on the original Xcode paths.
              with tarfile.open(
                  archive, "w:gz", dereference=True, compresslevel=6
              ) as package:
                  package.add(source, arcname=directory)

              metadata["sdks"].append({
                  "platform": sdk,
                  "version": version,
                  "source": str(source),
                  "archive": archive.name,
              })

          (destination / "metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cd "$RUNNER_TEMP/apple-ios-sdks"
          shasum -a 256 *.tar.gz metadata.json > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            oras login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Push artifact and report pinned reference
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apple-ios-sdks"

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" |
            tr '[:upper:]' '[:lower:]')"

          repository="ghcr.io/${owner}/apple-ios-sdks"
          tag="26.1-xcode26.1.1-17B100-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reference="${repository}:${tag}"

          oras push \
            --artifact-type application/vnd.onelogin.apple-sdks.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "$reference" \
            iPhoneOS26.1.sdk.tar.gz:application/gzip \
            iPhoneSimulator26.1.sdk.tar.gz:application/gzip \
            metadata.json:application/json \
            SHA256SUMS:text/plain

          digest="$(oras resolve "$reference")"

          {
            printf 'Artifact tag: `%s`\n\n' "$reference"
            printf 'Pinned CI reference: `%s@%s`\n\n' "$repository" "$digest"
            printf 'File SHA256 checksums:\n\n```text\n'
            cat SHA256SUMS
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
