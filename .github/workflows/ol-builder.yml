name: Build and publish OL builder

on:
  push:
    branches:
      - master
    paths:
      - "ol-builder/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          build_date="$(date -u +%Y%m%d)"
          short_rev="${GITHUB_SHA:0:7}"
          image="ghcr.io/${owner}/ol-builder:${build_date}-${short_rev}"
          echo "tag=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./ol-builder
          file: ./ol-builder/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ol-builder
          cache-to: type=gha,scope=ol-builder,mode=max

      - name: Report published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          printf 'Published image: `%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
